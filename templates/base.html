<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}books.mikhail.codes{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script>
        (function () {
            var stored = localStorage.getItem('theme');
            var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <div class="nav-panel">
                <a class="nav-btn" href="{{ url_for('showcase') }}" {% if request.path == '/' %}aria-current="page"{% endif %}>shelf</a>
                <a class="nav-btn" href="{{ url_for('recommender') }}" {% if request.path == '/recommender' %}aria-current="page"{% endif %}>recommender</a>
                <a class="nav-btn" href="https://mikhail.codes" target="_blank" rel="noopener noreferrer">mikhail.codes &#8599;</a>
            </div>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
                <span class="icon-sun"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.5v2.4M12 19.1v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"></path></svg></span>
                <span class="icon-moon"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.4 14.7A8.6 8.6 0 0 1 9.3 3.6a.6.6 0 0 0-.75-.8A9.8 9.8 0 1 0 21.2 15.4a.6.6 0 0 0-.8-.7Z"></path></svg></span>
            </button>
        </nav>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>a StoryGraph shelf, scraped not tapped</span>
            <span>books.mikhail.codes</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
