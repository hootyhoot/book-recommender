<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}books.mikhail.codes{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://app.thestorygraph.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=JetBrains+Mono:wght@400;600&display=swap">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <script>
        // theme cookie is shared with mikhail.codes; dark unless chosen otherwise
        document.documentElement.setAttribute('data-theme', (document.cookie.match(/(?:^|; )theme=(light|dark)/) || [])[1] || 'dark');
    </script>

    <!-- McMaster-Carr-style instant navigation: same-origin links get
         prerendered on hover/pointerdown in browsers that support the
         Speculation Rules API, so clicking "shelf"/"recommender" feels
         instant instead of waiting for a fresh request. Same-origin only
         (no StoryGraph links) - "eagerness: moderate" fires on hover
         intent, not on every link just entering the viewport. -->
    <script type="speculationrules">
    {
        "prerender": [{
            "where": { "href_matches": "/*" },
            "eagerness": "moderate"
        }]
    }
    </script>
</head>
<body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <header class="site-header">
        <nav class="navbar">
            <a class="nav-name" href="https://mikhail.codes">Mikhail Armanuel</a>
            <div class="nav-panel">
                <a class="nav-btn" href="{{ url_for('showcase') }}" {% if request.path == '/' %}aria-current="page"{% endif %}>shelf</a>
                <a class="nav-btn" href="{{ url_for('recommender') }}" {% if request.path == '/recommender' %}aria-current="page"{% endif %}>recommender</a>
                <a class="nav-btn" href="https://mikhail.codes" target="_blank" rel="noopener noreferrer">mikhail.codes &#8599;</a>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">
                    <svg class="icon-sun" viewBox="0 0 16 16" fill="currentColor"><rect x="6" y="6" width="4" height="4"/><rect x="7" y="1" width="2" height="3"/><rect x="7" y="12" width="2" height="3"/><rect x="1" y="7" width="3" height="2"/><rect x="12" y="7" width="3" height="2"/><rect x="3" y="3" width="2" height="2"/><rect x="11" y="3" width="2" height="2"/><rect x="3" y="11" width="2" height="2"/><rect x="11" y="11" width="2" height="2"/></svg>
                    <svg class="icon-moon" viewBox="0 0 16 16" fill="currentColor"><rect x="6" y="2" width="5" height="2"/><rect x="4" y="4" width="4" height="2"/><rect x="3" y="6" width="4" height="4"/><rect x="4" y="10" width="4" height="2"/><rect x="6" y="12" width="7" height="2"/><rect x="11" y="10" width="3" height="2"/></svg>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <span>&copy; {{ current_year() }} Mikhail Armanuel</span>
            <span>books.mikhail.codes</span>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/sky.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/prefetch-nav.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
